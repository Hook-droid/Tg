name: Build LyrxGram

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Maksimum disk temizligi
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: NDK kur
        run: |
          yes | sdkmanager "ndk;21.4.7075529" "cmake;3.22.1" || true

      - name: Swap alani buyut (RAM takviyesi)
        run: |
          sudo fallocate -l 12G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=12288
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Sadece arm64 + tek is parcacigi
        run: |
          sed -i "/defaultConfig {/a\\        ndk { abiFilters 'arm64-v8a' }" TMessagesProj/build.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties

      - name: gradlew calistirilabilir yap
        run: chmod +x gradlew

      - name: APK derle (debug - daha hafif)
        run: ./gradlew assembleAfatStandaloneDebug --stacktrace --no-daemon --max-workers=1 || ./gradlew assembleDebug --stacktrace --no-daemon --max-workers=1

      - name: APK bul
        id: apk
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          find . -name "*.apk"

      - name: Surum
        id: version
        run: echo "tag=lyrx-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Release olustur
        if: steps.apk.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LyrxGram ${{ steps.version.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
