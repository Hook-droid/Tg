name: Build LyrxGram

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Maksimum disk temizligi
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/lib/jvm
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Imza scripti olustur
        run: |
          cat > sign_setup.py << 'SIGNEOF'
          import re
          p = "TMessagesProj/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "signingConfigs" not in s:
              block = (
                  "    signingConfigs {\n"
                  "        lyrxrelease {\n"
                  "            storeFile file(\"lyrox-release.keystore\")\n"
                  "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")\n"
                  "            keyAlias System.getenv(\"KEY_ALIAS\")\n"
                  "            keyPassword System.getenv(\"KEY_PASSWORD\")\n"
                  "        }\n"
                  "    }\n"
              )
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
          s = s.replace(
              "        release {\n            jniDebuggable false",
              "        release {\n            signingConfig signingConfigs.lyrxrelease\n            jniDebuggable false",
              1)
          open(p, "w", encoding="utf-8").write(s)
          print("TMessagesProj imza eklendi")

          sp = "TMessagesProj_AppStandalone/build.gradle"
          ss = open(sp, encoding="utf-8").read()
          lyrxblock = (
              "    signingConfigs {\n"
              "        lyrxrelease {\n"
              "            storeFile file(\"../TMessagesProj/lyrox-release.keystore\")\n"
              "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"KEY_PASSWORD\")\n"
              "        }\n"
          )
          if "lyrxrelease {" not in ss:
              ss = ss.replace("    signingConfigs {\n", lyrxblock, 1)
          if "signingConfig signingConfigs.lyrxrelease" not in ss:
              ss = ss.replace(
                  "        standalone {\n",
                  "        standalone {\n            signingConfig signingConfigs.lyrxrelease\n",
                  1)
          ss = ss.replace(
              "            signingConfig signingConfigs.lyrxrelease\n            debuggable false\n            jniDebuggable false\n            signingConfig signingConfigs.release\n            applicationIdSuffix \".web\"\n",
              "            debuggable false\n            jniDebuggable false\n            signingConfig signingConfigs.lyrxrelease\n",
              1)
          import re as _re
          _open = ss.count("{")
          _close = ss.count("}")
          if _open != _close:
              raise SystemExit("HATA: brace dengesi bozuk %d/%d" % (_open, _close))
          open(sp, "w", encoding="utf-8").write(ss)
          print("Standalone imza eklendi")
          SIGNEOF

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK kur
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip
          rm commandlinetools-linux-12266719_latest.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/bin
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: NDK kur
        run: |
          $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;21.4.7075529" "cmake;3.22.1" || true

      - name: Logo arka plan ve isim ayarla
        run: |
          python3 -m pip install --quiet Pillow
          python3 << 'PYEOF'
          from PIL import Image
          import os
          import re

          src = Image.open('app_logo.png').convert('RGBA')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          base = 'TMessagesProj/src/main/res'

          launcher_names = [
              'ic_launcher', 'icon_2_launcher', 'icon_3_launcher',
              'icon_4_launcher', 'icon_5_launcher', 'icon_6_launcher',
          ]

          for folder, size in sizes.items():
              path = os.path.join(base, folder)
              if not os.path.isdir(path):
                  continue
              full = src.resize((size, size), Image.LANCZOS)
              for name in launcher_names:
                  full.save(os.path.join(path, f'{name}.png'))
                  full.save(os.path.join(path, f'{name}_round.png'))
              print(f'{folder}: {size}x{size} OK')
          print('Launcher ikonlari guncellendi')

          anydpi = os.path.join(base, 'mipmap-anydpi-v26')
          if os.path.isdir(anydpi):
              for f in os.listdir(anydpi):
                  if f.endswith('.xml'):
                      os.remove(os.path.join(anydpi, f))
              print('Adaptive xml silindi')

          drawable = os.path.join(base, 'drawable')
          if os.path.isdir(drawable):
              for f in os.listdir(drawable):
                  if 'background' in f and f.endswith('.xml'):
                      fp = os.path.join(drawable, f)
                      try:
                          txt = open(fp, encoding='utf-8').read()
                          txt = re.sub(r'android:startColor="#[0-9A-Fa-f]{6,8}"',
                                       'android:startColor="#1B0F2E"', txt)
                          txt = re.sub(r'android:endColor="#[0-9A-Fa-f]{6,8}"',
                                       'android:endColor="#2D1B4E"', txt)
                          txt = re.sub(r'android:color="#[0-9A-Fa-f]{6,8}"',
                                       'android:color="#1B0F2E"', txt)
                          open(fp, 'w', encoding='utf-8').write(txt)
                      except Exception as e:
                          print('atlandi', f, e)
              print('Arka plan renkleri koyu mora cevrildi')

          for root, dirs, files in os.walk(base):
              for fn in files:
                  if fn == 'strings.xml':
                      fp = os.path.join(root, fn)
                      try:
                          s = open(fp, encoding='utf-8').read()
                          s = re.sub(r'(<string name="Page1Title">)[^<]*(</string>)',
                                     r'\g<1>LyrxGram\g<2>', s)
                          s = re.sub(r'(<string name="AppName">)[^<]*(</string>)',
                                     r'\g<1>LyrxGram\g<2>', s)
                          s = re.sub(r'(<string name="AppNameBeta">)[^<]*(</string>)',
                                     r'\g<1>LyrxGram\g<2>', s)
                          s = re.sub(r'(<string name="AppUpdateBeta">)[^<]*(</string>)',
                                     r'\g<1>Update LyrxGram\g<2>', s)
                          open(fp, 'w', encoding='utf-8').write(s)
                      except Exception as e:
                          print('atlandi', fp, e)
          print('Tum dillerde Page1Title, AppName ve AppNameBeta LyrxGram yapildi')
          PYEOF

      - name: Swap alani buyut
        run: |
          sudo fallocate -l 12G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=12288
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Paket adini degistir
        run: |
          sed -i 's/APP_PACKAGE=org.telegram.messenger/APP_PACKAGE=com.lyrx.gram/' gradle.properties
          cat > gs_fix.py << 'GSEOF'
          import json, copy, glob
          for path in glob.glob("**/google-services.json", recursive=True):
              data = json.load(open(path, encoding="utf-8"))
              clients = data.get("client", [])
              names = [c["client_info"]["android_client_info"]["package_name"] for c in clients]
              if "com.lyrx.gram" in names:
                  continue
              base = None
              for c in clients:
                  if c["client_info"]["android_client_info"]["package_name"] == "org.telegram.messenger":
                      base = c
                      break
              if base is None and clients:
                  base = clients[0]
              if base is None:
                  continue
              for pkg in ["com.lyrx.gram", "com.lyrx.gram.web"]:
                  extra = copy.deepcopy(base)
                  extra["client_info"]["android_client_info"]["package_name"] = pkg
                  clients.append(extra)
              data["client"] = clients
              json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
              print("guncellendi:", path)
          GSEOF
          python3 gs_fix.py
          cat > settings.gradle << 'SETEOF'
          include ':TMessagesProj'
          include ':TMessagesProj_AppStandalone'
          SETEOF
          echo "settings.gradle sadelestirildi"
          grep -n "APP_PACKAGE" gradle.properties

      - name: Sadece arm64 + tek is parcacigi
        run: |
          sed -i "/defaultConfig {/a\\        ndk { abiFilters 'arm64-v8a' }" TMessagesProj/build.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties

      - name: Release imza ayarla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/lyrox-release.keystore
          python3 sign_setup.py
          grep -n "signingConfig" TMessagesProj/build.gradle

      - name: gradlew calistirilabilir yap
        run: chmod +x gradlew

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace --no-daemon --max-workers=1

      - name: APK bul
        id: apk
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Bulunan APK: $APK"

      - name: Surum
        id: version
        run: echo "tag=lyrx-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Release olustur
        if: steps.apk.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LyrxGram ${{ steps.version.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
