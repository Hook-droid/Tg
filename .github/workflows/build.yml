name: Build LyrxGram

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Disk temizle (yer ac)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: NDK kur
        run: |
          yes | sdkmanager "ndk;21.4.7075529" "cmake;3.22.1" || true

      - name: Tek mimari (arm64) ayarla
        run: |
          echo "APP_ABIS=arm64-v8a" >> gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1g" >> gradle.properties

      - name: gradlew calistirilabilir yap
        run: chmod +x gradlew

      - name: APK derle
        run: ./gradlew assembleAfatStandalone --stacktrace --no-daemon || ./gradlew assembleRelease --stacktrace --no-daemon

      - name: APK bul
        id: apk
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Bulunan: $APK"
          find . -name "*.apk"

      - name: Surum
        id: version
        run: echo "tag=lyrx-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Release olustur
        if: steps.apk.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LyrxGram ${{ steps.version.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
